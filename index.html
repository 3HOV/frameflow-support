    <p>Mac 相机拍照、录像与悬浮预览。适用于 macOS 13 及以上。</p>
    <ul>
      <li>使用内建摄像头、兼容的 USB 摄像头或 iPhone 连续互通相机。</li>
      <li>照片保存为 JPG，录像支持 MOV 和 MP4，导出无水印。</li>
      <li>支持倒计时、镜像、人脸效果，以及圆形或矩形悬浮预览。</li>
      <li>拍摄和画面处理均在本机完成，文件保存在你选择的文件夹。</li>
